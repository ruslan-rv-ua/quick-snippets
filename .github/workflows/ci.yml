# ─────────────────────────────────────────────────────────────────────────────
# ci.yml — тести та лінт для pull request і ручного запуску
# ─────────────────────────────────────────────────────────────────────────────
#
# Коли запускається:
#   • pull_request — репозиторій публічний, тож чужі зміни перевіряються;
#   • workflow_dispatch — вручну (Actions → CI → Run workflow).
# На кожен push у develop/main CI більше не запускається: ті самі перевірки
# виконуються локально в кожній задачі і в release.yml перед збіркою релізу.
#
# Запускає те саме, що й локально:
#   npm run lint      — TypeScript (tsc --noEmit) + cargo clippy -D warnings
#   npm run test      — Vitest
#   npm run test:rust — cargo test --lib (однопотоково, через SQLite)
#
# Нічого не збирає і не публікує — лише перевірки.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      # Tauri вимагає наявну папку frontendDist (dist/) навіть для clippy/test.
      - name: Build frontend
        run: npm run build

      - name: Lint (tsc + clippy)
        run: npm run lint

      - name: Frontend tests
        run: npm run test

      - name: Rust tests
        run: npm run test:rust
