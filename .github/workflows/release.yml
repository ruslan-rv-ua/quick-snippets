# ─────────────────────────────────────────────────────────────────────────────
# release.yml — GitHub Actions release workflow for QuickSnippets
# ─────────────────────────────────────────────────────────────────────────────
#
# ЩО ВІДБУВАЄТЬСЯ ПРИ ЗАПУСКУ
#   push тегу v*  →  збірка  →  ZIP + SHA256  →  GitHub Release  →
#   →  repository_dispatch  →  scoop-bucket автоматично оновлює маніфест
#
# ТРИГЕРИ
#   • push тегу  v*        — основний шлях: git tag v1.2.3 && git push --tags
#   • workflow_dispatch    — ручний перезапуск (наприклад, якщо автоматичний
#                            завершився з помилкою, а код вже виправлено)
#
# PRE-RELEASE
#   Теги з суфіксами -alpha, -beta, -rc автоматично позначаються як pre-release.
#   Крім того, при ручному запуску можна явно поставити прапорець prerelease.
#   Для pre-release крок "Update Scoop bucket" пропускається.
#
# НЕОБХІДНІ СЕКРЕТИ
#   SCOOP_BUCKET_TOKEN  — Fine-grained PAT з правом Contents: write на scoop-bucket
#
# BUILD STRATEGY
#   We use `cargo build --release` DIRECTLY instead of `npm run tauri build`.
#   Why: `tauri.conf.json` has `"bundle": { "active": true, "targets": "all" }`
#   which would invoke Wix/NSIS to produce MSI/NSIS installers.  The portability
#   model of this app needs only the raw .exe — no installer.
#   Procedure:
#     1. `npm ci`                       → install JS deps
#     2. `npx tauri build --no-bundle` → runs `npm run build` (via
#        beforeBuildCommand), sets compile-time constants that embed the
#        frontend into the binary, and compiles the Rust release binary —
#        all without invoking Wix/NSIS to produce an installer.
#        NOTE: --no-bundle skips the bundler, which means WebView2Loader.dll
#        is NOT automatically copied to target/release/.
#     3. Manual copy of WebView2Loader.dll from the webview2-com-sys build
#        output directory to target/release/ (step 7b).
#
# RELEASE ARTIFACTS
#   quick-snippets-windows-x64-v{version}.zip   — portable archive
#   quick-snippets-windows-x64-v{version}.zip.sha256  — SHA-256 checksum
#
# SCOOP BUCKET INTEGRATION (planned)
#   A separate workflow (release-scoop.yml) will listen to the `release` event
#   published here and update a Scoop manifest.  The download URL is predictable:
#     https://github.com/{owner}/{repo}/releases/download/v{version}/quick-snippets-windows-x64-v{version}.zip
#   The SHA-256 checksum file lets the Scoop bucket workflow populate the `hash`
#   field without re-downloading the ZIP.
#
# PERMISSIONS
#   Only `contents: write` is required to create releases and upload assets.
#   All other permissions are left at the default (`read` for public repos,
#   `none` for private) — principle of least privilege.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія (без "v", наприклад: 1.2.3)'
        required: true
        type: string
      prerelease:
        description: 'Позначити як pre-release?'
        required: false
        type: boolean
        default: false

env:
  # ─── ЄДИНЕ МІСЦЕ ДЕ ТРЕБА ЗМІНИТИ ІМ'Я ───────────────────────────────────
  # Регістр важливий: це ім'я буде використано в назві ZIP-архіву.
  # APP_ID (для event-type у scoop-bucket) буде автоматично приведено до lowercase.
  APP_NAME: quick-snippets
  # ──────────────────────────────────────────────────────────────────────────

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── ЗБІРКА ───────────────────────────────────────────────────────────────

      # ── Rust toolchain ────────────────────────────────────────────────────────
      # `@stable` вибирає останній стабільний Rust і враховує rust-toolchain.toml.
      # MSVC target вказано явно для однозначності (хоча windows-latest і так його використовує).
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ── Rust build cache ──────────────────────────────────────────────────────
      # Кешує ~/.cargo/registry, ~/.cargo/git та src-tauri/target.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Node.js ───────────────────────────────────────────────────────────────
      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # ── 6. Install JS dependencies ────────────────────────────────────────────
      # `tauri build` will run `beforeBuildCommand` (npm run build) internally,
      # so we only need `npm ci` here — no separate frontend build step.
      - name: Install JS dependencies
        run: npm ci

      # ── 7. Tauri release build (no installer bundle) ──────────────────────────
      # We use `npx tauri build --no-bundle` instead of raw
      # `cargo build --release` for three critical reasons:
      #
      #   1. FRONTEND EMBEDDING — the Tauri CLI sets compile-time constants that
      #      tell the binary to serve assets from the embedded bundle instead of
      #      connecting to the devUrl (localhost:1420).  A raw cargo invocation
      #      skips this, producing a binary that shows ERR_CONNECTION_REFUSED.
      #
      #   2. beforeBuildCommand — the CLI runs `npm run build` (as configured in
      #      tauri.conf.json) before compiling Rust, ensuring the frontend dist/
      #      directory is always fresh and in sync.
      #
      # WebView2Loader.dll is NOT copied by --no-bundle (that happens in the
      # bundler step which we skip).  It is copied manually in step 7b below.
      #
      # `--no-bundle` skips Wix/NSIS installer generation entirely, even though
      # `bundle.active = true` in tauri.conf.json.  This is distinct from
      # `--bundles` whose only valid values are `msi` and `nsis` — there is no
      # `none` value in Tauri v2.
      #
      # Release profile (defined in Cargo.toml) applies:
      #   strip = true  |  lto = true  |  codegen-units = 1  |  opt-level = "s"
      - name: Build Tauri app (release, no installer bundle)
        run: npx tauri build --no-bundle

      # ── 7b. Copy WebView2Loader.dll to target/release/ ───────────────────────
      # `--no-bundle` skips the Tauri bundler entirely, including the step that
      # copies WebView2Loader.dll from the webview2-com-sys build-script output
      # directory to target/release/.  Without this DLL next to the exe, the
      # WebView2 bootstrapper cannot locate the runtime and the app shows
      # ERR_CONNECTION_REFUSED on launch.
      #
      # The DLL is produced by the `webview2-com-sys` crate's build script and
      # lands at a hashed path:
      #   target/release/build/webview2-com-sys-{hash}/out/x64/WebView2Loader.dll
      # We glob for the x64 variant and copy it to target/release/.
      - name: Copy WebView2Loader.dll to release dir
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            'src-tauri/target/release/build/webview2-com-sys-*/out/x64/WebView2Loader.dll' `
            | Select-Object -First 1
          if (-not $dll) {
            Write-Error 'WebView2Loader.dll not found in build output — check webview2-com-sys build output'
            exit 1
          }
          Copy-Item $dll.FullName 'src-tauri/target/release/WebView2Loader.dll'
          $sizeMB = [Math]::Round($dll.Length / 1MB, 2)
          Write-Host "Copied: $($dll.FullName)  ($sizeMB MB)"

      # ── Verify artifacts ──────────────────────────────────────────────────────
      # Швидка перевірка — падаємо одразу з чітким повідомленням якщо файл відсутній.
      - name: Verify release artifacts exist
        shell: pwsh
        run: |
          $releaseDir = 'src-tauri/target/release'
          $required   = @('quick-snippets.exe', 'WebView2Loader.dll')
          $allOk = $true
          foreach ($file in $required) {
            $path = Join-Path $releaseDir $file
            if (Test-Path $path) {
              $sizeMB = [Math]::Round((Get-Item $path).Length / 1MB, 2)
              Write-Host "  OK  $file  ($sizeMB MB)"
            } else {
              Write-Error "MISSING: $path"
              $allOk = $false
            }
          }
          if (-not $allOk) { exit 1 }

      # ─────────────────────────────────────────────────────────────────────────

      # При push-тегу: VERSION береться з тегу (refs/tags/v1.2.3 → 1.2.3)
      # При ручному запуску: VERSION береться з inputs.version
      - name: Get version and app info
        id: info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          APP_ID=$(echo "${{ env.APP_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_ID=$APP_ID" >> $GITHUB_OUTPUT
          echo "Building ${{ env.APP_NAME }} version $VERSION (app id: $APP_ID)"

      - name: Create release package
        id: package
        shell: pwsh
        run: |
          $appName = "${{ env.APP_NAME }}"
          $version = "${{ steps.info.outputs.VERSION }}"
          $packageDir = $appName
          $zipName = "$appName-$version-windows-x64.zip"

          New-Item -ItemType Directory -Force -Path $packageDir

          Copy-Item "src-tauri/target/release/quick-snippets.exe" -Destination $packageDir
          Copy-Item "src-tauri/target/release/WebView2Loader.dll" -Destination $packageDir

          Compress-Archive -Path $packageDir -DestinationPath $zipName -Force

          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File -FilePath "$zipName.sha256" -NoNewline -Encoding ascii

          Write-Host "Package: $zipName"
          Write-Host "SHA256:  $hash"

          echo "HASH=$hash" >> $env:GITHUB_OUTPUT
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.VERSION }}
          files: |
            ${{ env.APP_NAME }}-*.zip
            ${{ env.APP_NAME }}-*.zip.sha256
          generate_release_notes: true
          draft: false
          # Pre-release якщо: тег містить -alpha/-beta/-rc АБО вручну позначено
          prerelease: ${{ inputs.prerelease || contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Оновлення scoop-bucket пропускається для pre-release (будь-якого виду)
      - name: Update Scoop bucket
        if: ${{ !inputs.prerelease && !contains(github.ref, '-alpha') && !contains(github.ref, '-beta') && !contains(github.ref, '-rc') }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          repository: ruslan-rv-ua/scoop-bucket
          event-type: update-${{ steps.info.outputs.APP_ID }}
          client-payload: |
            {
              "app": "${{ steps.info.outputs.APP_ID }}",
              "version": "${{ steps.info.outputs.VERSION }}",
              "hash": "${{ steps.package.outputs.HASH }}",
              "url": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.info.outputs.VERSION }}/${{ steps.package.outputs.ZIP_NAME }}"
            }
