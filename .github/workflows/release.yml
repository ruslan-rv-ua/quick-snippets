# ─────────────────────────────────────────────────────────────────────────────
# release.yml — GitHub Actions release workflow for QuickSnippets
# ─────────────────────────────────────────────────────────────────────────────
#
# ЩО ВІДБУВАЄТЬСЯ ПРИ ЗАПУСКУ
#   push тегу v*  →  збірка  →  ZIP + SHA256  →  GitHub Release  →
#   →  repository_dispatch  →  scoop-bucket автоматично оновлює маніфест
#
# ТРИГЕРИ
#   • push тегу  v*        — основний шлях: git tag v1.2.3 && git push --tags
#   • workflow_dispatch    — ручний перезапуск (наприклад, якщо автоматичний
#                            завершився з помилкою, а код вже виправлено)
#
# PRE-RELEASE
#   Теги з суфіксами -alpha, -beta, -rc автоматично позначаються як pre-release.
#   Крім того, при ручному запуску можна явно поставити прапорець prerelease.
#   Для pre-release крок "Update Scoop bucket" пропускається.
#
# НЕОБХІДНІ СЕКРЕТИ
#   SCOOP_BUCKET_TOKEN  — Fine-grained PAT з правом Contents: write на scoop-bucket
#
# BUILD STRATEGY
#   Використовуємо `cargo build --release` НАПРЯМУ замість `npm run tauri build`.
#   Причина: `tauri.conf.json` має `"bundle": { "active": true, "targets": "all" }`
#   що запустило б Wix/NSIS для створення MSI/NSIS-інсталяторів. Для портативного
#   застосунку потрібен лише .exe без інсталятора.
#   Порядок:
#     1. `npm ci`           → встановити JS-залежності
#     2. `npm run build`    → скомпілювати frontend у dist/ (Tauri вбудовує його)
#     3. `cargo build --release` у src-tauri/ → створити quick-snippets.exe
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія (без "v", наприклад: 1.2.3)'
        required: true
        type: string
      prerelease:
        description: 'Позначити як pre-release?'
        required: false
        type: boolean
        default: false

env:
  # ─── ЄДИНЕ МІСЦЕ ДЕ ТРЕБА ЗМІНИТИ ІМ'Я ───────────────────────────────────
  # Регістр важливий: це ім'я буде використано в назві ZIP-архіву.
  # APP_ID (для event-type у scoop-bucket) буде автоматично приведено до lowercase.
  APP_NAME: quick-snippets
  # ──────────────────────────────────────────────────────────────────────────

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── ЗБІРКА ───────────────────────────────────────────────────────────────

      # ── Rust toolchain ────────────────────────────────────────────────────────
      # `@stable` вибирає останній стабільний Rust і враховує rust-toolchain.toml.
      # MSVC target вказано явно для однозначності (хоча windows-latest і так його використовує).
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ── Rust build cache ──────────────────────────────────────────────────────
      # Кешує ~/.cargo/registry, ~/.cargo/git та src-tauri/target.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Node.js ───────────────────────────────────────────────────────────────
      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # ── Frontend build ────────────────────────────────────────────────────────
      # ОБОВ'ЯЗКОВО до `cargo build --release`.
      # tauri.conf.json має `"frontendDist": "../dist"` — Tauri вбудовує скомпільований
      # frontend під час компіляції Rust. Якщо dist/ відсутній — збірка впаде.
      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend (Vite + TypeScript)
        run: npm run build

      # ── Rust release build ────────────────────────────────────────────────────
      # Створює два потрібних файли:
      #   src-tauri/target/release/quick-snippets.exe   — основний бінарник
      #   src-tauri/target/release/WebView2Loader.dll   — WebView2 bootstrapper
      #
      # ВАЖЛИВО: `cargo build --release` компілює crate `webview2-com-sys`,
      # чий build-скрипт розпаковує WebView2Loader.dll у хешовану директорію:
      #   target/release/build/webview2-com-sys-{hash}/out/x64/WebView2Loader.dll
      # Tauri CLI зазвичай копіює цей DLL автоматично, але оскільки ми викликаємо
      # cargo напряму — робимо це самостійно в наступному кроці.
      - name: Build Rust binary (release profile)
        working-directory: src-tauri
        run: cargo build --release

      # ── Copy WebView2Loader.dll ───────────────────────────────────────────────
      # Без цього DLL поруч з .exe WebView2 не ініціалізується.
      - name: Copy WebView2Loader.dll to release dir
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            'src-tauri/target/release/build/webview2-com-sys-*/out/x64/WebView2Loader.dll' `
            | Select-Object -First 1
          if (-not $dll) {
            Write-Error 'WebView2Loader.dll not found in build output'
            exit 1
          }
          Copy-Item $dll.FullName 'src-tauri/target/release/WebView2Loader.dll'
          $sizeMB = [Math]::Round($dll.Length / 1MB, 2)
          Write-Host "Copied WebView2Loader.dll from: $($dll.FullName)  ($sizeMB MB)"

      # ── Verify artifacts ──────────────────────────────────────────────────────
      # Швидка перевірка — падаємо одразу з чітким повідомленням якщо файл відсутній.
      - name: Verify release artifacts exist
        shell: pwsh
        run: |
          $releaseDir = 'src-tauri/target/release'
          $required   = @('quick-snippets.exe', 'WebView2Loader.dll')
          $allOk = $true
          foreach ($file in $required) {
            $path = Join-Path $releaseDir $file
            if (Test-Path $path) {
              $sizeMB = [Math]::Round((Get-Item $path).Length / 1MB, 2)
              Write-Host "  OK  $file  ($sizeMB MB)"
            } else {
              Write-Error "MISSING: $path"
              $allOk = $false
            }
          }
          if (-not $allOk) { exit 1 }

      # ─────────────────────────────────────────────────────────────────────────

      # При push-тегу: VERSION береться з тегу (refs/tags/v1.2.3 → 1.2.3)
      # При ручному запуску: VERSION береться з inputs.version
      - name: Get version and app info
        id: info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          APP_ID=$(echo "${{ env.APP_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_ID=$APP_ID" >> $GITHUB_OUTPUT
          echo "Building ${{ env.APP_NAME }} version $VERSION (app id: $APP_ID)"

      - name: Create release package
        id: package
        shell: pwsh
        run: |
          $appName = "${{ env.APP_NAME }}"
          $version = "${{ steps.info.outputs.VERSION }}"
          $packageDir = $appName
          $zipName = "$appName-$version-windows-x64.zip"

          New-Item -ItemType Directory -Force -Path $packageDir

          Copy-Item "src-tauri/target/release/quick-snippets.exe" -Destination $packageDir
          Copy-Item "src-tauri/target/release/WebView2Loader.dll" -Destination $packageDir

          Compress-Archive -Path $packageDir -DestinationPath $zipName -Force

          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File -FilePath "$zipName.sha256" -NoNewline -Encoding ascii

          Write-Host "Package: $zipName"
          Write-Host "SHA256:  $hash"

          echo "HASH=$hash" >> $env:GITHUB_OUTPUT
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_NAME }}-*.zip
            ${{ env.APP_NAME }}-*.zip.sha256
          generate_release_notes: true
          draft: false
          # Pre-release якщо: тег містить -alpha/-beta/-rc АБО вручну позначено
          prerelease: ${{ inputs.prerelease || contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Оновлення scoop-bucket пропускається для pre-release (будь-якого виду)
      - name: Update Scoop bucket
        if: ${{ !inputs.prerelease && !contains(github.ref, '-alpha') && !contains(github.ref, '-beta') && !contains(github.ref, '-rc') }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          repository: ruslan-rv-ua/scoop-bucket
          event-type: update-${{ steps.info.outputs.APP_ID }}
          client-payload: |
            {
              "app": "${{ steps.info.outputs.APP_ID }}",
              "version": "${{ steps.info.outputs.VERSION }}",
              "hash": "${{ steps.package.outputs.HASH }}",
              "url": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.info.outputs.VERSION }}/${{ steps.package.outputs.ZIP_NAME }}"
            }
