# ─────────────────────────────────────────────────────────────────────────────
# notify-scoop-bucket.yml — Notify Scoop bucket of a new QuickSnippets release
# ─────────────────────────────────────────────────────────────────────────────
#
# OVERVIEW
#   Companion workflow that fires AFTER release.yml publishes a GitHub Release.
#   Fetches the SHA-256 hash from the .sha256 release asset, then sends a
#   `repository_dispatch` to the Scoop bucket repo so the manifest is updated.
#
#   release.yml also dispatches to the bucket directly (as a primary path).
#   This workflow acts as a clean, event-driven fallback — both are idempotent.
#
# TRIGGERS
#   • release: published — automatic, fires when release.yml creates a release
#   • workflow_dispatch  — manual re-trigger (e.g. if the automatic run failed)
#
# PRE-RELEASE
#   Pre-release tags (-alpha, -beta, -rc) are skipped automatically.
#
# SECRETS REQUIRED
#   SCOOP_BUCKET_TOKEN — Fine-grained PAT with Contents:write on scoop-bucket
# ─────────────────────────────────────────────────────────────────────────────

name: Notify Scoop Bucket

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: >
          Version to notify about (e.g. 1.2.3, without "v" prefix).
          Leave empty to read from the latest published release tag.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Send repository_dispatch to scoop-bucket
    runs-on: ubuntu-latest

    # Skip pre-releases (release event exposes the flag directly)
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

    steps:
      # ── 1. Determine version ─────────────────────────────────────────────────
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = ''

          # From release event — strip "v" prefix from tag
          if ('${{ github.event_name }}' -eq 'release') {
            $tag = '${{ github.event.release.tag_name }}'
            $version = $tag -replace '^v', ''
            Write-Host "Version from release tag: $version"
          }

          # From workflow_dispatch input
          if (-not $version -and '${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.Trim()
            if ($version) {
              Write-Host "Version from workflow_dispatch input: $version"
            }
          }

          # Fallback: query GitHub API for latest release
          if (-not $version) {
            Write-Host 'No version provided — querying GitHub Releases API...'
            $release = Invoke-RestMethod `
              -Uri 'https://api.github.com/repos/ruslan-rv-ua/quick-snippets/releases/latest' `
              -Headers @{ Accept = 'application/vnd.github+json' }
            $version = $release.tag_name -replace '^v', ''
            Write-Host "Latest release version: $version"
          }

          if (-not $version) {
            Write-Error 'Could not determine version'
            exit 1
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ── 2. Build URL and fetch hash from .sha256 release asset ───────────────
      - name: Resolve URL and hash
        id: assets
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.VERSION }}'
          $zipName = "quick-snippets-windows-x64-v${version}.zip"
          $url     = "https://github.com/ruslan-rv-ua/quick-snippets/releases/download/v${version}/${zipName}"
          $hashUrl = "${url}.sha256"

          Write-Host "ZIP URL:   $url"
          Write-Host "Hash URL:  $hashUrl"

          # Download the .sha256 file that release.yml uploaded as a release asset
          try {
            $hash = (Invoke-RestMethod -Uri $hashUrl -ErrorAction Stop).Trim()
          } catch {
            Write-Error "Failed to fetch .sha256 from: $hashUrl`n$_"
            exit 1
          }

          if (-not $hash -or $hash.Length -ne 64) {
            Write-Error "Unexpected hash value: '$hash'"
            exit 1
          }

          Write-Host "SHA256: $hash"

          "URL=$url"   | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "HASH=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ── 3. Send repository_dispatch to scoop-bucket ──────────────────────────
      - name: Dispatch update-quick-snippets event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          repository: ruslan-rv-ua/scoop-bucket
          event-type: update-quick-snippets
          client-payload: |
            {
              "app":     "quick-snippets",
              "version": "${{ steps.version.outputs.VERSION }}",
              "hash":    "${{ steps.assets.outputs.HASH }}",
              "url":     "${{ steps.assets.outputs.URL }}"
            }
