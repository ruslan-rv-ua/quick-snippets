# ─────────────────────────────────────────────────────────────────────────────
# notify-scoop-bucket.yml — Notify Scoop bucket of a new QuickSnippets release
# ─────────────────────────────────────────────────────────────────────────────
#
# OVERVIEW
#   Lightweight companion workflow that fires AFTER release.yml publishes a
#   GitHub Release. It sends a `repository_dispatch` event to the Scoop bucket
#   repo so the manifest is automatically updated.
#
# TRIGGERS
#   • release: published — automatic, fires when release.yml creates a release
#   • workflow_dispatch  — manual re-trigger (e.g. if the automatic run failed)
#
# DOES NOT modify release.yml — this is a separate, independent workflow.
#
# SECRETS REQUIRED
#   BUCKET_REPO_PAT — GitHub PAT (classic) with `repo` scope on the
#                     ruslan-rv-ua/scoop-bucket repository.
# ─────────────────────────────────────────────────────────────────────────────

name: Notify Scoop Bucket

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: >
          Version to notify about (e.g. 1.2.3, without "v" prefix).
          Leave empty to read from the latest published release tag.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Send repository_dispatch to scoop-bucket
    runs-on: ubuntu-latest

    steps:
      # ── 1. Determine version ─────────────────────────────────────────────────
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = ''

          # From release event — strip "v" prefix from tag
          if ('${{ github.event_name }}' -eq 'release') {
            $tag = '${{ github.event.release.tag_name }}'
            $version = $tag -replace '^v', ''
            Write-Host "Version from release tag: $version"
          }

          # From workflow_dispatch input
          if (-not $version -and '${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.Trim()
            if ($version) {
              Write-Host "Version from workflow_dispatch input: $version"
            }
          }

          # Fallback: query GitHub API for latest release
          if (-not $version) {
            Write-Host 'No version provided — querying GitHub Releases API...'
            $release = Invoke-RestMethod `
              -Uri 'https://api.github.com/repos/ruslan-rv-ua/quick-snippets/releases/latest' `
              -Headers @{ Accept = 'application/vnd.github+json' }
            $version = $release.tag_name -replace '^v', ''
            Write-Host "Latest release version: $version"
          }

          if (-not $version) {
            Write-Error 'Could not determine version'
            exit 1
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ── 2. Send repository_dispatch to scoop-bucket ──────────────────────────
      - name: Dispatch quick-snippets-released event
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.VERSION }}'

          $body = @{
            event_type     = 'quick-snippets-released'
            client_payload = @{
              version = $version
            }
          } | ConvertTo-Json -Compress

          Write-Host "Dispatching to ruslan-rv-ua/scoop-bucket:"
          Write-Host "  event_type: quick-snippets-released"
          Write-Host "  version:    $version"

          Invoke-RestMethod `
            -Method Post `
            -Uri 'https://api.github.com/repos/ruslan-rv-ua/scoop-bucket/dispatches' `
            -Headers @{
              Accept        = 'application/vnd.github+json'
              Authorization = 'Bearer ${{ secrets.BUCKET_REPO_PAT }}'
            } `
            -Body $body `
            -ContentType 'application/json'

          Write-Host 'Repository dispatch sent successfully'
