[package]
name = "quick-snippets"
version = "0.3.3"
description = "QuickSnippets — portable Windows desktop app for quick snippet access"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "quick_snippets_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rfd = "0.14"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

# Every copy or auto-type of an encrypted snippet runs 600,000 rounds of PBKDF2-HMAC-SHA256.
# Optimising only the SHA-256 crate for speed halves that wait (about 150 ms -> 70 ms on a
# 2024 desktop CPU) and costs a few KB of exe size.
[profile.release.package.sha2]
opt-level = 3

# Debug and test builds: without these two overrides the Rust test suite needs minutes
# instead of seconds, because every encrypt or decrypt in a test runs the full 600,000 rounds.
# The second one optimises only this crate, and only when it is built for tests.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.quick-snippets]
opt-level = 3

[profile.release-fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = false

